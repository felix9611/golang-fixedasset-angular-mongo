<div class="bg-white p-[2rem] grid grid-cols-1 gap-3">
    <div class="grid grid-cols-1 lg:grid-cols-2 lg:flex gap-2 p-5 shawdow-lg border-2 border-[#A9A9A9] rounded-lg w-full">
        <div>
            <nz-range-picker
                nzSize="large"
                class="h-full"
                name="date"
                [nzShowTime]="{ nzFormat: 'HH:mm' }"
                nzFormat="yyyy-MM-dd HH:mm:ss"
                [(ngModel)]="globalFilter.purchaseDates"
            ></nz-range-picker>
        </div>
        <div class="lg:w-[260px] h-full">
            <app-filter-list-small
                label="Asset Type"
                [apiUrl]="'/asset/type/filter/list'"
                [requestBody]="assetTypeSearchForm"
                [postApi]="loadAssetTypeLists"
                [multiple]="true"
                [searchDataKey]="['typeCode', 'typeName']"
                [(value)]="globalFilter.typeIds"
                (valueChange)="globalFilter.typeIds"
            />
        </div>
        <div class="lg:w-[260px] h-full">
            <app-filter-list-small
                label="Location"
                [apiUrl]="'/base/location/filter/list'"
                [requestBody]="placeSearchForm"
                [postApi]="loadPlaceLists"
                [multiple]="true"
                [searchDataKey]="['placeCode', 'placeName']"
                [(value)]="globalFilter.placeIds"
                (valueChange)="globalFilter.placeIds"
            />
        </div>
        <div class="lg:w-[260px] h-full">
            <app-filter-list-small
                label="Department"
                [apiUrl]="'/sys/department/filter/list'"
                [requestBody]="deptSearchForm"
                [postApi]="loadDeptLists"
                [multiple]="true"
                [searchDataKey]="['deptCode', 'deptName']"
                [(value)]="globalFilter.deptIds"
                (valueChange)="globalFilter.deptIds"
            />
        </div>
        <div (click)="runSearch()" class="w-[100px]  border-1 border-[#54A4FF] hover:bg-[#2E7FDB] text-center px-1 py-2 rounded-lg">
            Search
        </div>
    </div>

    <div class="p-2 shawdow-lg border-2 border-[#A9A9A9] rounded-lg">
        <div class="font-bold">Costs by Year-month and Department</div>
        <app-chart class="w-[100%]" *ngIf="deptAndDateInCostLoading" [(chartData)]="deptAndDateInCost" />
    </div>

    <div class="p-2 shawdow-lg border-2 border-[#A9A9A9] rounded-lg">
        <div class="font-bold">Counts by Year-month and Department</div>
        <app-chart class="w-[100%]" *ngIf="deptAndDateInCountLoading" [(chartData)]="deptAndDateInCount" />
    </div>

    <div class="p-2 shawdow-lg border-2 border-[#A9A9A9] rounded-lg">
        <div class="font-bold">Counts by Year-month and Asset Type</div>
        <app-chart class="w-[100%]" *ngIf="typeAndDateInCountLoading" [(chartData)]="typeAndDateInCount" />
    </div>

    <div class="p-2 shawdow-lg border-2 border-[#A9A9A9] rounded-lg">
        <div class="font-bold">Costs by Year-month and Asset Type</div>
        <app-chart class="w-[100%]" *ngIf="typeAndDateInCostLoading"  [(chartData)]="typeAndDateInCost" />
    </div>

    <div class="p-2 shawdow-lg border-2 border-[#A9A9A9] rounded-lg">
        <div class="font-bold">Counts by Year-month and Location</div>
        <app-chart class="w-[100%]" *ngIf="placeAndDateInCountLoading" [(chartData)]="placeAndDateInCount" />
    </div>

    <div class="p-2 shawdow-lg border-2 border-[#A9A9A9] rounded-lg">
        <div class="font-bold">Costs by Year-month and Location</div>
        <app-chart class="w-[100%]" *ngIf="placeAndDateInCostsLoading" [(chartData)]="placeAndDateInCosts" />
    </div>

            <div class="font-bold">Costs by Type</div>

        </div>
    </div>

        <div class="font-bold">Costs by Type</div>

    </div>-->

</div>
